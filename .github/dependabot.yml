# Dependabot — 의존성 자동 업데이트 PR 생성
# 문서: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # ── npm 의존성 ───────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "area/config"
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      lint-deps:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
      test-deps:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
    ignore:
      # 메이저 업그레이드는 수동으로
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ───────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type/ci"
      - "area/config"
      - "dependencies"
    commit-message:
      prefix: "ci"
